# GitLab CI/CD configuration for bark language
# Builds release binaries when tags are created

stages:
  - test
  - build
  - release
  - trigger

# Run tests on every commit
test:
  stage: test
  image: golang:1.25
  script:
    - go version
    - go test ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Build release binaries only when tags are created
build:
  stage: build
  image: golang:1.25
  before_script:
    - apt-get update && apt-get install -y zip
  script:
    - echo "Building bark version $CI_COMMIT_TAG"
    - chmod +x build.sh
    - ./build.sh $CI_COMMIT_TAG
    - |
      cd dist
      # Lite versions (default, smaller)
      tar -czf bark-${CI_COMMIT_TAG}-darwin-arm64.tar.gz bark-darwin-arm64
      tar -czf bark-${CI_COMMIT_TAG}-darwin-amd64.tar.gz bark-darwin-amd64
      tar -czf bark-${CI_COMMIT_TAG}-linux-amd64.tar.gz bark-linux-amd64
      tar -czf bark-${CI_COMMIT_TAG}-linux-arm64.tar.gz bark-linux-arm64
      zip bark-${CI_COMMIT_TAG}-windows-amd64.zip bark-windows-amd64.exe
      # Full versions (with SQL)
      tar -czf bark-full-${CI_COMMIT_TAG}-darwin-arm64.tar.gz bark-full-darwin-arm64
      tar -czf bark-full-${CI_COMMIT_TAG}-darwin-amd64.tar.gz bark-full-darwin-amd64
      tar -czf bark-full-${CI_COMMIT_TAG}-linux-amd64.tar.gz bark-full-linux-amd64
      tar -czf bark-full-${CI_COMMIT_TAG}-linux-arm64.tar.gz bark-full-linux-arm64
      zip bark-full-${CI_COMMIT_TAG}-windows-amd64.zip bark-full-windows-amd64.exe
  artifacts:
    name: "bark-$CI_COMMIT_TAG"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

# Create GitLab release with download links
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build
      artifacts: true
  script:
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_HOST
    - |
      glab release create "$CI_COMMIT_TAG" \
        --notes "Release $CI_COMMIT_TAG - Lite builds (~7MB) are recommended. Full builds (~10MB) include SQLite support." \
        --assets-links '[
          {"name": "macOS ARM64 (Apple Silicon)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-'${CI_COMMIT_TAG}'-darwin-arm64.tar.gz?job=build"},
          {"name": "macOS AMD64 (Intel)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-'${CI_COMMIT_TAG}'-darwin-amd64.tar.gz?job=build"},
          {"name": "Linux AMD64", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-'${CI_COMMIT_TAG}'-linux-amd64.tar.gz?job=build"},
          {"name": "Linux ARM64", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-'${CI_COMMIT_TAG}'-linux-arm64.tar.gz?job=build"},
          {"name": "Windows AMD64", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-'${CI_COMMIT_TAG}'-windows-amd64.zip?job=build"},
          {"name": "macOS ARM64 Full (with SQL)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-full-'${CI_COMMIT_TAG}'-darwin-arm64.tar.gz?job=build"},
          {"name": "macOS AMD64 Full (with SQL)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-full-'${CI_COMMIT_TAG}'-darwin-amd64.tar.gz?job=build"},
          {"name": "Linux AMD64 Full (with SQL)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-full-'${CI_COMMIT_TAG}'-linux-amd64.tar.gz?job=build"},
          {"name": "Linux ARM64 Full (with SQL)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-full-'${CI_COMMIT_TAG}'-linux-arm64.tar.gz?job=build"},
          {"name": "Windows AMD64 Full (with SQL)", "url": "'${CI_PROJECT_URL}'/-/jobs/artifacts/'${CI_COMMIT_TAG}'/raw/dist/bark-full-'${CI_COMMIT_TAG}'-windows-amd64.zip?job=build"}
        ]'
  rules:
    - if: $CI_COMMIT_TAG

# Trigger website rebuild when examples or docs change
trigger-website:
  stage: trigger
  trigger:
    project: bark-lang/website
    branch: main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - examples/**/*
        - docs/**/*
        - readme.md
